<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de RPG</title>
    <link rel="stylesheet" href="estilagem.css">
</head>
<body>
    <header>Ficha Feitiçeiros e maldições</header>
    <h1>Atributos</h1>
    <table border="1">
        <tr>
            <th>Atributo</th>
            <th>Valor</th>
            <th>Modificador</th>
            <th>Atributo</th>
            <th>Valor</th>
            <th>Modificador</th>
        </tr>

        <tr>
            <td>Força</td>
            <td><input type="number" id="valFor"></td>
            <td id="modFor"></td>
            <td>Inteligência</td>
            <td><input type="number" id="valInt"></td>
            <td id="modInt"></td>
        </tr>

        <tr>
            <td>Destreza</td>
            <td><input type="number" id="valDes"></td>
            <td id="modDes"></td>
            <td>Sabedoria</td>
            <td><input type="number" id="valSab"></td>
            <td id="modSab"></td>
        </tr>

        <tr>
            <td>Constituição</td>
            <td><input type="number" id="valCons"></td>
            <td id="modCons"></td>
            <td>Carisma</td>
            <td><input type="number" id="valCar"></td>
            <td id="modCar"></td>
        </tr>
    </table>

    <script src="fun.js"></script>
</body>
</html>
